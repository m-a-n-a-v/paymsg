[workspace]
resolver = "2"
members = [
  "crates/paymsg-core",
  "crates/paymsg-iso20022",
  "crates/paymsg-mt",
  "crates/paymsg-validate",
  "crates/paymsg-translate",
  "crates/paymsg-codegen",
  "crates/paymsg-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["paymsg contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/paymsg"
rust-version = "1.75"

[workspace.dependencies]
# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# XML processing
quick-xml = { version = "0.37", features = ["serialize"] }

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Pattern matching
regex = "1"

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Precise decimal arithmetic
rust_decimal = { version = "1", features = ["serde-str"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Internal workspace dependencies
paymsg-core = { path = "crates/paymsg-core" }
paymsg-iso20022 = { path = "crates/paymsg-iso20022" }
paymsg-mt = { path = "crates/paymsg-mt" }
paymsg-validate = { path = "crates/paymsg-validate" }
paymsg-translate = { path = "crates/paymsg-translate" }
paymsg-codegen = { path = "crates/paymsg-codegen" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
